; Type-checker configuration (ADR-0010 Rev 4, Phase 0 prerequisite).
;
; INI format to match the repository's existing convention (pytest.ini, alembic.ini);
; there is no pyproject.toml here, so adding one purely for mypy would be a larger
; change than the prerequisite needs.
;
; Adoption strategy — deliberately incremental, per ADR-0010 Rev 4 §I.2:
; errors are reported ONLY for the packages listed with `ignore_errors = False`.
; Everything else is still parsed (so imports resolve and signatures are known)
; but its pre-existing errors are not reported, because fixing them is out of
; scope for this phase and would violate "do not silently fix unrelated bugs".
;
; Coverage starts at src.shared_kernel.* because that is where ADR-0010 Rev 4
; places the two types the ADR depends on being checked:
;   - the Permission enum          (shared_kernel/application/security.py)
;   - the Principal value object   (shared_kernel/application/security.py)
; Coverage expands deliberately in later phases, one package at a time, as each
; is brought to zero errors. The 21 pre-existing errors in src.modules.* are
; recorded in the Phase 0 report and are NOT addressed here.

[mypy]
python_version = 3.12
files = src
; Third-party packages without bundled stubs (asyncpg, redis, jwt, ...).
ignore_missing_imports = True
; Imported modules are analysed for types but their own errors stay unreported
; unless the module opts in below.
follow_imports = silent
ignore_errors = True
; Keep the report readable and actionable.
show_error_codes = True
pretty = True

; --- Opted-in packages -----------------------------------------------------
; Shared Kernel is the ADR's typed foundation: Permission and Principal live
; here, and every context depends on them.
;
; `disallow_untyped_defs` is deliberately NOT enabled yet. It fires on two
; pre-existing `__aexit__(self, exc_type, exc, tb)` signatures in the Unit of
; Work classes, and annotating them is unrelated to authorization (see Phase 0
; report, "pre-existing type debt"). It will be enabled for the new security
; module in Phase 1, where the code is written to satisfy it from the start.
; The checks that matter for Permission/Principal — arg-type, assignment,
; return-type, optional handling — are active here today.
[mypy-src.shared_kernel.*]
ignore_errors = False
warn_return_any = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True

; The ADR-0011 authorization primitives are held to the stricter bar the ADR asks
; for: every definition annotated. These modules are new, so they satisfy it from
; the start — unlike the pre-existing UoW `__aexit__` signatures that kept the
; flag off for the package as a whole.
[mypy-src.shared_kernel.application.permissions]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.shared_kernel.application.security]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

; Principal assembly (Phase 1B). New authorization code, so it meets the same
; bar as the Shared Kernel primitives it builds on.
[mypy-src.api.security]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

; Identity's authorization surface: the token contract and the RBAC grant
; adapters. Opted in because Phase 1B makes them authorization-critical; the rest
; of src.modules.* stays unreported until each package is brought to zero.
[mypy-src.modules.identity.infrastructure.jwt_service]
ignore_errors = False

[mypy-src.modules.identity.infrastructure.role_repository]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.identity.application.ports]
ignore_errors = False

; Pre-existing defect, NOT introduced and NOT fixed by this phase:
; `Entity.id` is annotated `object`, so `record_event` passes `object` where
; `DomainEvent.aggregate_id` expects `UUID | None` (base.py:81). Recorded in the
; Phase 0 report as type debt. Excluded here rather than patched, because
; changing the domain base class is out of Phase 0 scope and touches every
; aggregate. Remove this section when that debt is addressed deliberately.
[mypy-src.shared_kernel.domain.base]
ignore_errors = True

; Phase 1E RBAC baseline + drift. New authorization-critical code, held to the
; same bar as the Shared Kernel primitives it builds on.
[mypy-src.modules.identity.application.rbac_baseline]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.identity.application.roles]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.identity.infrastructure.rbac_drift]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

; Phase 1F membership resolution. New authorization-critical code.
[mypy-src.modules.merchant.application.member_permissions]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.merchant.infrastructure.membership_query]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.merchant.infrastructure.membership_cache]
ignore_errors = False

; --- Phase 1G.1: the identity session-security surface ----------------------
; The account gate and the refresh/logout revocation path. Opted in because this
; phase makes them authentication-critical, and because claiming "mypy passes"
; while the new security code went unchecked would be worthless.
[mypy-src.modules.identity.domain.entities]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.identity.infrastructure.repository]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.modules.identity.interface.dependencies]
ignore_errors = False

; NOT opted in: src.modules.identity.application.use_cases.
; It carries 2 PRE-EXISTING errors at `VerifyOtp._issue_tokens`, where `user.id`
; is `object` because `Entity.id` is annotated `object` in the domain base class
; — the same recorded debt that keeps `src.shared_kernel.domain.base` excluded
; above. Neither line was touched by this phase, and fixing them means changing
; the base class for every aggregate, which is out of scope. The Phase 1G.1
; additions to that module (the UserStatusQuery injection, the account check and
; the Logout use case) were verified clean in isolation.
