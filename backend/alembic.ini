# Alembic configuration — Persian RTL e-commerce (modular monolith)
#
# The DB URL is intentionally NOT hardcoded here. env.py reads it from the
# DATABASE_URL environment variable so the same config works across
# dev / staging / prod without editing this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamped, ordered, human-readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is supplied at runtime by env.py (from DATABASE_URL).
# Leave blank here on purpose.
sqlalchemy.url =

[post_write_hooks]
# Format generated migrations with ruff if it is installed (no-op otherwise).
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
